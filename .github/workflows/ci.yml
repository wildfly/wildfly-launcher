# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: WildFly Launcher - CI

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC

# Only run the latest job for pull requests, do not cancel runs on branches or scheduled runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MVN_CMD: './mvnw -V -B'

jobs:

  build:
    name: '${{ matrix.os }}'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest' , 'windows-latest',  'macos-latest' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDKs
        uses: actions/setup-java@v6
        with:
          cache: 'maven'
          distribution: 'temurin'
          # Please note the order here of having 25 last as that is the version we want to compile with
          java-version: |
            17
            21
            27
            25
      - name: Build and Test on ${{ matrix.os }} - Java 25
        run: ${{ env.MVN_CMD }} clean verify
      - name: Build and Test on ${{ matrix.os }} - Java 27
        run: ${{ env.MVN_CMD }} verify '-Dtest.java.home=${{env.JAVA_HOME_27_X64}}${{env.JAVA_HOME_27_AARCH64}}' '-Dsurefire.reportsDirectory=${project.build.directory}/surefire-reports/java27'
      - name: Build and Test on ${{ matrix.os }} - Java 21
        run: ${{ env.MVN_CMD }} verify '-Dtest.java.home=${{env.JAVA_HOME_21_X64}}${{env.JAVA_HOME_21_AARCH64}}' '-Dsurefire.reportsDirectory=${project.build.directory}/surefire-reports/java21'
      - name: Build and Test on ${{ matrix.os }} - Java 17
        run: ${{ env.MVN_CMD }} verify '-Dtest.java.home=${{env.JAVA_HOME_17_X64}}${{env.JAVA_HOME_17_AARCH64}}' '-Dsurefire.reportsDirectory=${project.build.directory}/surefire-reports/java17'
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/logs/
            **/surefire-reports*/

  build-jdk-11:
    name: '${{ matrix.os }}-jdk11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ 'ubuntu-latest' , 'windows-latest',  'macos-latest' ]

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: 11
          cache: 'maven'
          distribution: 'temurin'
      - name: Build and Test on ${{ matrix.os }} - 11
        run: ${{ env.MVN_CMD }} clean verify
      - name: Upload test logs for failed run
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}-jdk11
          path: |
            **/logs/
            **/surefire-reports*/